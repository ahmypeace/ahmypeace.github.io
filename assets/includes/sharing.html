<script>
document.addEventListener("DOMContentLoaded", function () {
  // Include raw HTML links and footer links as well as Markdown references.
  document.querySelectorAll('a[href]').forEach(function (link) {
    const destination = new URL(link.href, window.location.href);
    if (/^https?:$/.test(destination.protocol) &&
        (destination.origin !== window.location.origin || /\.pdf$/i.test(destination.pathname))) {
      link.target = "_blank";
      link.relList.add("noopener", "noreferrer");
    }
  });

  if (!document.body.classList.contains("blog-post")) return;
  const main = document.querySelector("main.content");
  if (!main) return;
  const canonical = document.querySelector('meta[property="og:url"]');
  const url = canonical ? canonical.content : window.location.href.split(/[?#]/)[0];
  const heading = document.querySelector("h1.title");
  const title = heading ? heading.textContent.trim() : document.title;
  const encodedURL = encodeURIComponent(url);
  const encodedTitle = encodeURIComponent(title);
  const panel = document.createElement("aside");
  panel.className = "article-share";
  panel.setAttribute("aria-labelledby", "article-share-title");
  panel.innerHTML = '<h2 id="article-share-title">Keep the conversation going</h2>' +
    '<p>Found this useful? Share it with someone who would enjoy it.</p>' +
    '<div class="article-share-actions"></div>' +
    '<p class="article-share-status" role="status" aria-live="polite"></p>';
  const actions = panel.querySelector(".article-share-actions");
  const status = panel.querySelector(".article-share-status");
  const platforms = [
    ["WhatsApp", "https://wa.me/?text=" + encodeURIComponent(title + "\n" + url)],
    ["Facebook", "https://www.facebook.com/sharer/sharer.php?u=" + encodedURL],
    ["LinkedIn", "https://www.linkedin.com/sharing/share-offsite/?url=" + encodedURL],
    ["X", "https://twitter.com/intent/tweet?url=" + encodedURL + "&text=" + encodedTitle],
    ["Reddit", "https://www.reddit.com/submit?url=" + encodedURL + "&title=" + encodedTitle]
  ];
  platforms.forEach(function (platform) {
    const link = document.createElement("a");
    link.textContent = platform[0];
    link.href = platform[1];
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.setAttribute("aria-label", "Share on " + platform[0] + " (opens in a new tab)");
    actions.appendChild(link);
  });

  async function copyLink(platform) {
    const instructions = {
      Instagram: "Paste it into an Instagram message or a Story link sticker.",
      Substack: "Paste it into a Substack Note or post.",
      Medium: "Paste it into your Medium draft."
    };
    const hint = instructions[platform] || "It's ready to share.";
    const previous = panel.querySelector(".article-share-copy-field");
    if (previous) previous.remove();
    try {
      await navigator.clipboard.writeText(url);
      status.textContent = "Link copied. " + hint;
    } catch (error) {
      status.textContent = "Copy the link below. " + hint;
      const field = document.createElement("input");
      field.className = "article-share-copy-field";
      field.type = "text";
      field.readOnly = true;
      field.value = url;
      field.setAttribute("aria-label", "Article link to copy");
      panel.appendChild(field);
      field.focus();
      field.select();
    }
  }
  ["Instagram", "Substack", "Medium", "Copy link"].forEach(function (platform) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = platform;
    button.setAttribute("aria-label", platform === "Copy link" ? "Copy article link" : "Copy link to share on " + platform);
    button.title = platform === "Copy link" ? "Copy article link" : "Copy link to share on " + platform;
    button.addEventListener("click", function () { copyLink(platform); });
    actions.appendChild(button);
  });
  const related = main.querySelector(".blog-related");
  if (related) related.before(panel);
  else main.appendChild(panel);
});
</script>
